version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lobe-chat_app_1
      APP_PORT: 3210
    container_name: lobe-chat_app_proxy_1
  app:
    image: lobehub/lobe-chat-database:latest
    restart: on-failure
    user: '1000:1000'
    container_name: lobe-chat_app_1
    environment:
      - NEXT_PUBLIC_ENABLE_NEXT_AUTH=${NEXT_PUBLIC_ENABLE_NEXT_AUTH}
      - NEXT_AUTH_SECRET=${NEXT_AUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - DATABASE_URL=${DATABASE_URL}
      - KEY_VAULTS_SECRET=${KEY_VAULTS_SECRET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_PUBLIC_DOMAIN=${S3_PUBLIC_DOMAIN}
