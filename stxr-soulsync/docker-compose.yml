version: '3.8'

services:
  soulsync:
    image: boulderbadgedad/soulsync:latest
    container_name: soulsync-webui
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    environment:
      # User/Group ID configuration
      - PUID=1000
      - PGID=1000
      - UMASK=022
      # Web server configuration
      - FLASK_ENV=production
      - PYTHONPATH=/app
      # Optional: Configure through environment variables
      - SOULSYNC_CONFIG_PATH=/app/config/config.json
      # Set timezone
      - TZ=America/New_York
    ports:
      - "8008:8008"      # Main web app
      - "8888:8888"      # Spotify OAuth callback
      - "8889:8889"      # Tidal OAuth callback
    volumes:
      # Persistent data volumes
      - ${APP_DATA_DIR}/config:/app/config
      - ${APP_DATA_DIR}/logs:/app/logs
      - ${APP_DATA_DIR}/downloads:/app/downloads
      # Use named volume for database persistence (separate from host database)
      - soulsync_database:/app/database
      # IMPORTANT: Mount the drives containing your download and transfer folders
      - ${UMBREL_ROOT}/home/Downloads/soulseek/complete:/app/downloads
      - ${UMBREL_ROOT}/home/Downloads/soulseek/music:/app/Transfer:rw
      # Optional: Mount your music library for Plex/Jellyfin access
      - ${UMBREL_ROOT}/home/Downloads/soulseek/music:/music:ro
    extra_hosts:
      # Allow container to reach host services
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/"]
      interval: 90s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1024M
    networks:
      - umbrel_main_network

# Named volumes for persistent data
volumes:
  soulsync_database:
    driver: local

# Optional: Add external network for communication with other containers
networks:
  umbrel_main_network:
    external: true
