version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: slskd
      APP_PORT: 5030
    container_name: slskd_app_proxy

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 5030:5030
      - 5031:5031
      - 50300:50300
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/home/Downloads:/app/downloads
      - ${UMBREL_ROOT}/home/Downloads/incomplete:/app/incomplete
    restart: on-failure
