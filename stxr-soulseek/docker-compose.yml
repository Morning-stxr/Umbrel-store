version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: slskd
      APP_PORT: 5030
    container_name: slskd_app_proxy

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    expose:
      - 5030
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data:/app
      - ${UMBREL_ROOT}/home/Downloads:/app/umbrel
      - ${UMBREL_ROOT}/home/Downloads/soulseek/incomplete:/app/incomplete
      - ${UMBREL_ROOT}/home/Downloads/soulseek/complete:/app/downloads
    restart: on-failure
